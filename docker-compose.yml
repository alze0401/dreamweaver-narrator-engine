# ============================================
# 织梦绮谭 - Docker Compose 生产部署
# 服务: backend + mysql + redis + minio
# 使用宿主机 Nginx 做反向代理
# ============================================

version: "3.8"

services:
  # ---- FastAPI 后端 ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dreamweaver-backend
    restart: always
    env_file:
      - ./backend/.env.prod
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - dreamweaver

  # ---- MySQL 8.0 数据库 ----
  mysql:
    image: mysql:8.0
    container_name: dreamweaver-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: dreamweaver_root_2026
      MYSQL_DATABASE: narrator_engine
      MYSQL_USER: narrator
      MYSQL_PASSWORD: narrator2024
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-unarrator", "-pnarrator2024"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dreamweaver

  # ---- Redis 缓存 ----
  redis:
    image: redis:7-alpine
    container_name: dreamweaver-redis
    restart: always
    command: redis-server --requirepass narrator2024 --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "narrator2024", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dreamweaver

  # ---- MinIO 对象存储 ----
  minio:
    image: minio/minio:latest
    container_name: dreamweaver-minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9002:9001"
    volumes:
      - minio_data:/data
    networks:
      - dreamweaver

networks:
  dreamweaver:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  minio_data:
  backend_data:
