# ============================================
# 织梦绮谭 - Nginx 配置（宿主机 nginx）
# 前端静态文件 + API 代理 + MinIO 资源代理
# ============================================

server {
    listen 80;
    server_name 101.200.130.3;

    # 最大上传大小（角色头像、BGM 等）
    client_max_body_size 30M;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # ---- 前端静态文件 ----
    root /opt/dreamweaver/frontend/dist;
    index index.html;

    # 前端路由（React Router）—— 非 API/非资源的请求 fallback 到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 前端静态资源缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- API 反向代理 → FastAPI 后端 ----
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 支持
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---- FastAPI 文档 ----
    location /docs {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
    location /redoc {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # ---- 后端根路径（健康检查） ----
    location = /backend/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
    }

    # ---- MinIO 公开资源代理 ----
    # URL 格式: /minio/dreamweaver-assets/preset/characters/xxx.webp
    # MINIO_PUBLIC_URL 已包含桶名，只需剥去 /minio/ 前缀
    location /minio/ {
        rewrite ^/minio/(.*) /$1 break;
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host "127.0.0.1:9000";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        expires 7d;
        add_header Cache-Control "public";
    }
}
